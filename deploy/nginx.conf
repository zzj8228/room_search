server {
    listen 80;
    server_name 10.129.81.32;
    client_max_body_size 4k;
    location = /admin { return 301 https://$host/admin/; }
    location /admin/ { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    server_name 10.129.81.32;
    ssl_certificate /etc/room-search/tls.crt;
    ssl_certificate_key /etc/room-search/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /admin { return 301 /admin/; }
    location /admin/desktop/ { return 404; }
    location /admin/ {
        access_log off;
        auth_basic "Classroom administrator";
        auth_basic_user_file /etc/room-search/admin.htpasswd;
        proxy_pass http://127.0.0.1:8767/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
